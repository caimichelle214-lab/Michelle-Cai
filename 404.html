<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面没有找到 · 蔡敏依</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#16233a; --accent:#b08d57; --muted:#586a86; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--muted); background: #fbfaf7; text-align: center; padding: 32px;
  }
  .code { font-family: Georgia, "Songti SC", serif; font-size: 76px; color: var(--accent); line-height: 1; }
  h1 { font-family: Georgia, "Songti SC", serif; color: var(--ink); font-size: 26px; margin: 18px 0 10px; }
  p { margin: 0 0 26px; max-width: 40ch; }
  a.btn {
    display: inline-block; padding: 11px 24px; border-radius: 999px;
    background: var(--ink); color: #fbfaf7; text-decoration: none; font-size: 14.5px; font-weight: 600;
  }
  a.btn:hover { background: #0f1a2c; }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1 id="t1">页面没有找到</h1>
    <p id="t2">你访问的页面不存在，或者链接已经更改。</p>
    <a class="btn" id="home" href="./index.html">返回首页</a>
  </main>

<script>
  (function () {
    var en = false;
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var l = q || localStorage.getItem('cm-lang');
      if (!l) l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      en = (l === 'en');
    } catch (e) {}

    if (en) {
      document.documentElement.lang = 'en';
      document.title = 'Page Not Found · Cai Minyi';
      document.getElementById('t1').textContent = 'Page Not Found';
      document.getElementById('t2').textContent = 'The page you are looking for does not exist, or the link has changed.';
      document.getElementById('home').textContent = 'Back to home';
    }

    // 在 GitHub Pages 项目站点上，回到仓库根目录 / resolve the project-site root
    try {
      var base = './';
      if (location.protocol.indexOf('http') === 0) {
        var seg = location.pathname.split('/').filter(Boolean)[0] || '';
        base = (seg && seg.indexOf('.') === -1) ? '/' + seg + '/' : '/';
      }
      document.getElementById('home').setAttribute('href', base + 'index.html');
    } catch (e) {}
  })();
</script>
</body>
</html>
