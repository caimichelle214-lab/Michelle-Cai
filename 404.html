<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5efe4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='4' fill='%23a3352b'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23f7f0e4' font-family='Songti SC,serif'%3E%E6%9D%8E%3C/text%3E%3C/svg%3E">
<title>页未寻见 · 李杜 · 诗句互文</title>
<style>
  :root{
    --paper:#f5efe4;--ink:#211d19;--ink3:#6a6054;--ink4:#968b7b;--red:#a3352b;--gold:#a8863f;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","STSong","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:32px;background:
      radial-gradient(70% 60% at 50% 40%,#fdf9f0 0%,rgba(253,249,240,0) 70%),
      var(--paper);
    color:var(--ink);font-family:var(--sans);text-align:center;
  }
  .wrap{max-width:560px}
  .seal{
    width:46px;height:46px;margin:0 auto 30px;background:var(--red);color:#f8f1e4;
    display:grid;place-items:center;font-family:var(--serif);font-size:13px;
    writing-mode:vertical-rl;line-height:1.15;rotate:-4deg;
  }
  .code{
    font-family:var(--serif);font-size:clamp(80px,18vw,140px);line-height:1;
    letter-spacing:.06em;color:var(--ink);opacity:.9;
  }
  h1{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.3em;text-indent:.3em;margin:22px 0 0}
  p{font-size:13.5px;line-height:2;color:var(--ink3);margin:16px 0 0}
  .poem{font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:var(--ink);margin-top:26px;line-height:2}
  .poem span{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.24em;color:var(--ink4);margin-top:8px}
  a{
    display:inline-block;margin-top:36px;padding:12px 30px;border:1px solid var(--ink);
    color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.26em;text-indent:.26em;
    transition:background .3s,color .3s,border-color .3s;
  }
  a:hover{background:var(--ink);color:var(--paper)}
  .rule{width:60px;height:1px;background:rgba(33,29,25,.25);margin:30px auto 0}
</style>
</head>
<body>
  <main class="wrap">
    <div class="seal">李杜</div>
    <div class="code">404</div>
    <h1>此路不通</h1>
    <p>这一页不在全唐诗里，也不在对照表中。<br>或许是地址有误，或许是诗句散佚。</p>
    <div class="poem">欲渡黄河冰塞川，将登太行雪满山。<span>李白《行路难》</span></div>
    <div class="rule"></div>
    <a href="./">返回首页</a>
  </main>
</body>
</html>
